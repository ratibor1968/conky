-- Conky: network monitor panel (top-left)
-- Live copy is maintained at ~/.conky/conky_network.conf
-- NOTE: this file is a TEMPLATE. Every @IFACE@ is replaced with the
-- detected primary interface by conky_start.sh. Palette: Catppuccin Mocha.

conky.config = {
    -- Window
    background = false,
    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'conky_net',
    own_window_class = 'ConkyNet',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#D21E1E2E',

    -- Placement
    alignment = 'top_left',
    minimum_width = 340,
    maximum_width = 340,
    gap_x = 24,
    gap_y = 24,
    border_inner_margin = 16,
    border_outer_margin = 0,

    -- Fonts and colours
    use_xft = true,
    font = 'Fira Sans:size=10',
    xftalpha = 1,
    draw_shades = false,
    draw_outline = false,
    default_color = '#CDD6F4',
    color1 = '#89B4FA',   -- accent (blue)
    color2 = '#A6ADC8',   -- labels (subtext)
    color3 = '#CDD6F4',   -- values (text)
    color4 = '#F9E2AF',   -- warning
    color5 = '#F38BA8',   -- critical
    color6 = '#A6E3A1',   -- good
    color7 = '#585B70',   -- dim / headers
    color8 = '#94E2D5',   -- teal

    -- Behaviour
    update_interval = 2,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    draw_borders = false,
    draw_graph_borders = false,
    use_spacer = 'none',
    override_utf8_locale = true,
    text_buffer_size = 4096,
    net_avg_samples = 2,
    default_bar_width = 308,
    default_bar_height = 6,
};

conky.text = [[
${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=14}${color1} NETWORK
${voffset 14}${font Fira Sans:Bold:size=9}${color1}LINK
${voffset 7}${font Fira Sans:size=10}${color2}Interface${alignr}${color3}${gw_iface}
${color2}Address${alignr}${color3}${addr @IFACE@}
${color2}Gateway${alignr}${color3}${gw_ip}
${voffset 18}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} TRAFFIC
${voffset 7}${font Fira Sans:size=10}${color2}Download${alignr}${color3}${downspeed @IFACE@}
${voffset 6}${downspeedgraph @IFACE@ 32,308 89B4FA 6C7086}
${voffset 11}${color2}Upload${alignr}${color3}${upspeed @IFACE@}
${voffset 6}${execgraph ~/.conky/bin/conky_net_up.sh 32,308 F9E2AF FAB387 0}
${voffset 11}${color2}Total Down${alignr}${color3}${totaldown @IFACE@}
${color2}Total Up${alignr}${color3}${totalup @IFACE@}
${voffset 18}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} CONNECTIONS
${voffset 7}${font Fira Sans:size=10}${color2}Established${alignr}${color3}${execi 5 ss -tn state established 2>/dev/null | tail -n +2 | wc -l}
${voffset 8}${font Noto Sans Mono:size=9}${execpi 5 ~/.conky/bin/conky_net_peers.sh}
]]
