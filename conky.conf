-- Conky: system monitor panel (top-right)
-- Live copy is maintained at ~/.conky/conky.conf
-- Palette: Catppuccin Mocha

conky.config = {
    -- Window
    background = false,
    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'conky_system',
    own_window_class = 'ConkySystem',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#D21E1E2E',

    -- Placement
    alignment = 'top_right',
    minimum_width = 240,
    maximum_width = 240,
    gap_x = 24,
    gap_y = 24,
    border_inner_margin = 16,
    border_outer_margin = 0,

    -- Fonts and colours
    use_xft = true,
    font = 'Fira Sans:size=10',
    xftalpha = 1,
    draw_shades = false,
    draw_outline = false,
    default_color = '#CDD6F4',
    color1 = '#89B4FA',   -- accent (blue)
    color2 = '#A6ADC8',   -- labels (subtext)
    color3 = '#CDD6F4',   -- values (text)
    color4 = '#F9E2AF',   -- warning
    color5 = '#F38BA8',   -- critical
    color6 = '#A6E3A1',   -- good
    color7 = '#585B70',   -- dim / headers
    color8 = '#94E2D5',   -- teal

    -- Behaviour
    update_interval = 3,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    draw_borders = false,
    draw_graph_borders = false,
    use_spacer = 'none',
    override_utf8_locale = true,
    text_buffer_size = 4096,
    cpu_avg_samples = 2,
    default_bar_width = 240,
    default_bar_height = 6,
    top_name_width = 22,
};

conky.text = [[
${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} SYSTEM${alignr}${font Fira Sans:Bold:size=22}${color1}${time %H:%M}
${voffset 4}${font Fira Sans:size=9}${color2}${time %A, %d %B}${alignr}${color2}Uptime ${color3}${uptime}
${voffset 14}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} CPU
${voffset 7}${font Fira Sans:size=9}${color2}${execi 3600 lscpu | grep 'Model name' | cut -d: -f2- | sed 's/^ *//' | cut -c1-40}
${voffset 2}${font Fira Sans:Bold:size=20}${color3}${cpu}${font Fira Sans:Bold:size=10}${color2}% used${alignr}${font Fira Sans:size=10}${color3}${execi 5 ~/.conky/bin/conky_cpu_temp.sh}°C   ${execi 2 ~/.conky/bin/conky_cpu_power.sh}
${voffset 9}${cpugraph 32,240 89B4FA 6C7086}
${execpi 2 ~/.conky/bin/conky_cached.sh cores 5 ~/.conky/bin/conky_cpu_cores.sh}
${voffset 14}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} GPU
${voffset 7}${font Fira Sans:size=9}${color2}${execi 3600 ~/.conky/bin/conky_gpu_sample.sh name}
${voffset 2}${font Fira Sans:Bold:size=20}${color3}${execi 3 ~/.conky/bin/conky_gpu_usage.sh}${font Fira Sans:Bold:size=10}${color2}% used${alignr}${font Fira Sans:size=10}${color3}${execi 3 ~/.conky/bin/conky_gpu_temp.sh}°C   ${execi 3 ~/.conky/bin/conky_gpu_power.sh}
${voffset 9}${execgraph ~/.conky/bin/conky_gpu_usage.sh 32,240 89B4FA 6C7086 100}
${voffset 7}${font Fira Sans:size=10}${color2}VRAM${alignr}${color3}${execi 4 ~/.conky/bin/conky_gpu_vram.sh}%
${voffset 6}${color1}${execibar 4 ~/.conky/bin/conky_gpu_vram.sh}
${voffset 14}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} MEMORY
${voffset 7}${font Fira Sans:size=10}${color2}RAM${alignr}${color3}${execi 10 ~/.conky/bin/conky_bytes.sh memused} / ${execi 300 ~/.conky/bin/conky_bytes.sh mem}   ${memperc}%
${voffset 6}${membar 6,240}
${voffset 7}${color2}Swap${alignr}${color3}${execi 10 ~/.conky/bin/conky_bytes.sh swapused} / ${execi 300 ~/.conky/bin/conky_bytes.sh swap}   ${swapperc}%
${voffset 14}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} STORAGE
${voffset 7}${font Fira Sans:size=10}${color2}Root${alignr}${color3}${execi 30 ~/.conky/bin/conky_bytes.sh fs_used:/} / ${execi 300 ~/.conky/bin/conky_bytes.sh fs_size:/}   ${fs_used_perc /}%
${voffset 6}${fs_bar 6,240 /}
${voffset 14}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} PROCESSES
${voffset 7}${font Noto Sans Mono:size=9}${execpi 2 ~/.conky/bin/conky_cached.sh procs 5 ~/.conky/bin/conky_top_procs.sh}
]]
