-- Conky: network monitor panel (top-left)
-- Live copy is maintained at ~/.conky/conky_network.conf
-- The active interface is detected at runtime by bin/conky_net_iface.sh, so
-- switching between wired and Wi-Fi is followed without restarting. Palette:
-- Catppuccin Mocha.

conky.config = {
    -- Window
    background = false,
    own_window = true,
    own_window_type = 'normal',
    own_window_title = 'conky_net',
    own_window_class = 'ConkyNet',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#D21E1E2E',

    -- Placement
    alignment = 'top_left',
    minimum_width = 240,
    maximum_width = 240,
    gap_x = 24,
    gap_y = 24,
    border_inner_margin = 16,
    border_outer_margin = 0,

    -- Fonts and colours
    use_xft = true,
    font = 'Fira Sans:size=10',
    xftalpha = 1,
    draw_shades = false,
    draw_outline = false,
    default_color = '#CDD6F4',
    color1 = '#89B4FA',   -- accent (blue)
    color2 = '#A6ADC8',   -- labels (subtext)
    color3 = '#CDD6F4',   -- values (text)
    color4 = '#F9E2AF',   -- warning
    color5 = '#F38BA8',   -- critical
    color6 = '#A6E3A1',   -- good
    color7 = '#585B70',   -- dim / headers
    color8 = '#94E2D5',   -- teal

    -- Behaviour
    update_interval = 3,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,
    draw_borders = false,
    draw_graph_borders = false,
    use_spacer = 'none',
    override_utf8_locale = true,
    text_buffer_size = 4096,
    net_avg_samples = 2,
    default_bar_width = 240,
    default_bar_height = 6,
};

conky.text = [[
${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=14}${color1} NETWORK
${voffset 14}${font Fira Sans:Bold:size=9}${color1}LINK
${voffset 7}${font Fira Sans:size=10}${execpi 3 ~/.conky/bin/conky_net_link.sh}
${voffset 18}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} TRAFFIC
${voffset 7}${font Fira Sans:size=10}${color2}Download${alignr}${color3}${execi 2 ~/.conky/bin/conky_net_rate.sh rx text}
${voffset 6}${execgraph ~/.conky/bin/conky_net_down.sh 32,240 89B4FA 6C7086 0}
${voffset 11}${color2}Upload${alignr}${color3}${execi 2 ~/.conky/bin/conky_net_rate.sh tx text}
${voffset 6}${execgraph ~/.conky/bin/conky_net_up.sh 32,240 F9E2AF FAB387 0}
${voffset 11}${color2}Total Down${alignr}${color3}${execi 15 ~/.conky/bin/conky_net_total.sh rx}
${color2}Total Up${alignr}${color3}${execi 15 ~/.conky/bin/conky_net_total.sh tx}
${voffset 18}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} CONNECTIONS
${voffset 7}${font Fira Sans:size=10}${color2}Established${alignr}${color3}${execi 10 ~/.conky/bin/conky_net_est.sh}
${voffset 8}${font Noto Sans Mono:size=9}${execpi 10 ~/.conky/bin/conky_net_peers.sh}
${voffset 14}${font Font Awesome 7 Free:style=Solid:size=10}${color1}${font Fira Sans:Bold:size=9}${color1} BY PROCESS
${voffset 8}${font Noto Sans Mono:size=9}${execpi 8 ~/.conky/bin/conky_net_byproc.sh}
]]
